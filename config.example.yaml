config_version: 1
log_level: info

models:
  - name: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    description: 谣言检测智能体主模型

    use: langchain_openai:ChatOpenAI
    model: deepseek-v4-flash

    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com

    supports_thinking: true
    supports_reasoning_effort: false
    supports_vision: false

    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled

# 无需额外 API Key 的网页搜索。主智能体不会直接调用该工具，
# 只会委托受调用次数限制的 web-researcher 收集公开来源。
tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5

  # 读取用户直接提供的公开网页 URL。默认使用受限本地抓取；配置
  # JINA_API_KEY 后优先使用 Jina Reader 处理复杂网页。
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 12
    max_chars: 12000

# 限制联网核验子智能体的最长运行时间，避免网络异常导致长时间等待。
subagents:
  agents:
    web-researcher:
      timeout_seconds: 55
    authority-researcher:
      timeout_seconds: 55
    evidence-critic:
      timeout_seconds: 20

# “Local”指相对于应用进程本地运行。
# 由于整个应用在 Docker 容器中，因此不会使用 Mac 本机的 Python 环境。
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# 将 LangGraph 会话状态保存到挂载的数据目录。
checkpointer:
  type: sqlite
  connection_string: /data/checkpoints/store.db
