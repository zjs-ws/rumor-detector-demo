services:
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile.local

    image: rumor-detector-demo:enhanced-one
    container_name: rumor-langgraph
    init: true
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      DEER_FLOW_CONFIG_PATH: /app/config.yaml
      DEER_FLOW_HOME: /data
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./runtime:/data

    ports:
      - "2024:2024"

    command:
      - uv
      - run
      - langgraph
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "2024"
      - --no-browser
      - --allow-blocking
      - --no-reload

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:2024/docs
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.local

    image: rumor-detector-demo:enhanced-one
    container_name: rumor-gateway
    init: true
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      DEER_FLOW_CONFIG_PATH: /app/config.yaml
      DEER_FLOW_HOME: /data
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: "8001"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
      - ./runtime:/data

    ports:
      - "8001:8001"

    command:
      - uv
      - run
      - uvicorn
      - app.gateway.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

    depends_on:
      langgraph:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8001/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev

    image: rumor-buster-frontend:local
    container_name: rumor-frontend
    init: true
    restart: unless-stopped
    working_dir: /app/frontend

    environment:
      NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_LANGGRAPH_BASE_URL: http://localhost:2024
      NEXT_PUBLIC_STATIC_WEBSITE_ONLY: "false"

    ports:
      - "3000:3000"

    command:
      - pnpm
      - dev
      - --hostname
      - 0.0.0.0

    depends_on:
      langgraph:
        condition: service_healthy
      gateway:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/workspace/chats/new').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
