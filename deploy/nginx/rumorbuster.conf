resolver 127.0.0.11 valid=10s ipv6=off;

upstream rumorbuster_frontend {
    zone rumorbuster_frontend 64k;
    server frontend:3000 resolve;
}

upstream rumorbuster_gateway {
    zone rumorbuster_gateway 64k;
    server gateway:8001 resolve;
}

upstream rumorbuster_langgraph {
    zone rumorbuster_langgraph 64k;
    server langgraph:2024 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location = /healthz {
        proxy_pass http://rumorbuster_gateway/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ^~ /api/langgraph/ {
        proxy_pass http://rumorbuster_langgraph/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /api/ {
        proxy_pass http://rumorbuster_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://rumorbuster_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
